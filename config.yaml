# ============================================================
# K12 解题模型自动化评测 —— 统一配置文件
# ============================================================
# 所有可调参数集中在这里。密钥不写在本文件，用 ${ENV_VAR} 引用，
# 实际值放在同目录的 .env 里（见 .env.example），.env 已被 .gitignore 忽略。
#
# 覆盖方式（优先级从低到高）：
#   1. 本文件
#   2. 环境变量（用于 ${...} 占位符）
#   3. 命令行参数（如 --concurrency）
#
# 想用自己的配置文件：export AUTO_EVAL_CONFIG=/path/to/my-config.yaml
# ============================================================


# ------------------------------------------------------------
# providers：模型/服务接入点。想换成自己的网关，只改这里。
# 每个 provider 下都标了「推荐」值——不改也能跑，改了就是你自己的接口。
# ------------------------------------------------------------
providers:

  # Stage 1 智能切题：百度智能云 OCR「试卷切题与识别（多模态）」
  # 推荐（默认）：https://ai.baidu.com/tech/ocr/paper-cut
  # 控制台申请 API Key / Secret Key：https://console.bce.baidu.com/ai/#/ai/ocr/app/list
  # 想换成自己的切题服务：改三个 URL，并同步 stage1_ocr_cut_questions.py 的响应解析。
  baidu_ocr:
    token_url: https://aip.baidubce.com/oauth/2.0/token
    create_task_url: https://aip.baidubce.com/rest/2.0/ocr/v1/paper_cut_edu_vlm/create_task
    get_result_url: https://aip.baidubce.com/rest/2.0/ocr/v1/paper_cut_edu_vlm/get_result
    api_key: ${BAIDU_OCR_API_KEY}
    secret_key: ${BAIDU_OCR_SECRET_KEY}

  # Stage 2 图片审核分类 + Stage 3 部分参考模型
  # 推荐（默认）：百度千帆，OpenAI 兼容协议 https://console.bce.baidu.com/qianfan/
  # 换任何 OpenAI 兼容服务只改 base_url + key，代码不用动。
  qianfan:
    base_url: https://qianfan.baidubce.com/v2/chat/completions
    api_key: ${QIANFAN_API_KEY}

  # Stage 3/4/7 用的 OpenAI 兼容聚合网关（doubao / claude / gemini 等非千帆模型走这里）
  # 推荐：任一聚合网关或自建代理，例如
  #   OpenRouter   https://openrouter.ai/api/v1/chat/completions
  #   自建 one-api  https://your-gateway/v1/chat/completions
  #   自建 vLLM     http://127.0.0.1:8000/v1/chat/completions
  # 默认留空，必须自己填一个，否则 Stage 3/4/7 无法请求。
  openai_compat:
    base_url: ${OPENAI_COMPAT_BASE_URL}
    # Anthropic 原生 /v1/messages 端点（Claude 走这条分支）。
    # 留空则自动把 base_url 里的 /chat/completions 换成 /messages。
    messages_url: null
    api_key: ${OPENAI_COMPAT_API_KEY}

  # Stage 5 对象存储：把本地题图转成公网可访问 URL，供只接受 URL 的待测模型使用。
  # 推荐（默认）：百度对象存储 BOS https://console.bce.baidu.com/bos/
  # 若待测模型支持直传图片（如把 target_model.input_mode 设为 image），Stage 5 可以整段跳过。
  bos:
    endpoint: ${BOS_ENDPOINT}          # 例：bj.bcebos.com
    bucket: ${BOS_BUCKET}              # 例：your-bucket-name（需公开读，否则待测模型拉不到图）
    access_key_id: ${BOS_ACCESS_KEY_ID}
    secret_access_key: ${BOS_SECRET_ACCESS_KEY}
    local_root_name: image_ocr_clean   # 本地根目录名，上传时会替换成批次时间

  # ----------------------------------------------------------
  # Stage 6 待测模型：被评测的那个解题接口，完全可自定义。
  # ----------------------------------------------------------
  target_model:
    # 接口风格，决定 stage6_target_solve.py 走哪条请求/解析分支：
    #   baidu_solve    推荐（默认）百度智能云 OCR「拍照解题」
    #   openai_compat  任意 OpenAI 兼容的多模态 chat 接口（自建模型、聚合网关都行）
    api_style: baidu_solve

    # 题图从哪来：
    #   url    读 Excel AE 列的公网 URL（需要先跑 Stage 5 上传图床）
    #   image  直接读 Excel B 列的本地图片并 base64 上传（可跳过 Stage 5）
    input_mode: url

    timeout: 200
    max_retries: 1
    concurrency: 1                     # 待测接口通常有 QPS 限制，默认串行

    # api_style: baidu_solve 时生效
    # 产品页：https://ai.baidu.com/tech/ocr/solve
    # API 文档：https://cloud.baidu.com/doc/OCR/s/Mmqsveul4
    # 公测期个人实名 200 次 / 企业实名 500 次免费额度；鉴权与 Stage 1 同一套 API Key/Secret Key 机制
    baidu_solve:
      token_url: https://aip.baidubce.com/oauth/2.0/token
      solve_url: https://aip.baidubce.com/stream/2.0/ocr/v1/solve
      api_key: ${TARGET_SOLVE_API_KEY}
      secret_key: ${TARGET_SOLVE_SECRET_KEY}
      disable_preprocess: false        # 是否开启图片矫正与增强
      stream_switch: false             # false=一次性返回完整结果；true=按 SSE 分块返回后自动拼接

    # api_style: openai_compat 时生效
    # 提示词见 prompts/stage6_target_solve.md（只喂图片 + 输出格式要求，
    # 不喂学段/学科/题型，与「拍照解题」只收图片的口径保持一致）
    openai_compat:
      base_url: ${TARGET_MODEL_BASE_URL}   # 例：https://your-gateway/v1/chat/completions
      api_key: ${TARGET_MODEL_API_KEY}
      model: ${TARGET_MODEL_NAME}          # 例：your-vision-model
      temperature: 0.1                     # null = 不下发该字段
      enable_thinking: true                # null = 不下发该字段


# ------------------------------------------------------------
# models：各阶段用什么模型
# ------------------------------------------------------------
models:

  # Stage 2：图片有效性判定 + 学段/学科/题型分类
  classify:
    provider: qianfan
    model: ernie-5.0-thinking-latest
    temperature: 0.2
    enable_thinking: false
    timeout: 200
    max_retries: 1

  # Stage 3：参考模型解题。列表顺序即 M1..M5，改这里就能换模型集合。
  # excel_columns 是结果写回 evaluation.xlsx 的列号（1-based），
  # 增删模型必须同步调整列号，并同步 scoring.reference_targets。
  reference_models:
    - label: M1(ernie)
      provider: qianfan
      model: ernie-5.0-thinking-latest
      temperature: 0.1
      enable_thinking: true
      excel_columns: { time: 6, model: 7, reasoning: 8, answer: 9 }      # F G H I
    - label: M2(doubao)
      provider: openai_compat
      model: doubao-seed-2-0-pro-260215
      temperature: 0.1
      enable_thinking: true
      excel_columns: { time: 10, model: 11, reasoning: 12, answer: 13 }  # J K L M
    - label: M3(qwen)
      provider: qianfan
      model: qwen3-vl-235b-a22b-thinking
      temperature: 0.1
      enable_thinking: true
      excel_columns: { time: 14, model: 15, reasoning: 16, answer: 17 }  # N O P Q
    - label: M4(claude)
      provider: openai_compat
      api_style: claude                 # 走 Anthropic 风格调用分支；省略则用 OpenAI 兼容分支
      model: anthropic/claude-opus-4-8
      temperature: null                 # null = 不下发 temperature 字段
      enable_thinking: true
      excel_columns: { time: 18, model: 19, reasoning: 20, answer: 21 }  # R S T U
    - label: M5(gemini)
      provider: openai_compat
      model: gemini-3.1-pro-preview
      temperature: 0.1
      enable_thinking: true
      excel_columns: { time: 22, model: 23, reasoning: 24, answer: 25 }  # V W X Y

  # Stage 4：共识裁判。从五个参考模型答案里选出高置信伪标准答案。
  consensus_judge:
    provider: openai_compat
    model: anthropic/claude-opus-4-8
    temperature: null
    enable_thinking: true

  # Stage 7：评分裁判。建议用能力最强的模型，且不要和待测模型同源。
  score_judge:
    provider: openai_compat
    model: anthropic/claude-opus-4-8
    temperature: null
    enable_thinking: true


# ------------------------------------------------------------
# prompts：提示词全部外置到 prompts/ 目录，改文件即生效，不用碰代码。
# 每个文件的作用、可用占位符见 prompts/README.md。
# ------------------------------------------------------------
prompts:
  dir: prompts
  files:
    clean_classify: stage2_clean_classify.md   # Stage 2 有效性判定与分类
    solve: stage3_solve.md                     # Stage 3 参考模型解题（五模型共用）
    consensus: stage4_consensus.md             # Stage 4 共识伪标签
    target_solve: stage6_target_solve.md       # Stage 6 待测模型解题（仅 api_style=openai_compat 时使用）
    score_target: stage7_score_target.md       # Stage 7 待测模型评分
    score_reference: stage7_score_reference.md # Stage 7 参考模型横向评分


# ------------------------------------------------------------
# runtime：并发、超时、图片处理
# ------------------------------------------------------------
runtime:
  solve_concurrency: 20          # Stage 3 请求级并发
  consensus_concurrency: 8       # Stage 4
  score_concurrency: 8           # Stage 7（也可用 --concurrency 覆盖）
  request_timeout: 200           # 单次 LLM 请求超时（秒）
  max_retries: 1                 # LLM 请求失败重试次数
  max_image_bytes: 5242880       # 5MB：超过则自动压缩后再转 base64
  jpeg_quality: 85               # 压缩初始质量

ocr:
  create_max_retries: 3          # 创建切题任务重试次数
  query_attempts: 3              # 结果查询轮次
  poll_max_retries: 30           # 单轮最大轮询次数
  poll_interval: 3               # 轮询间隔（秒）


# ------------------------------------------------------------
# evaluation：评测口径
# ------------------------------------------------------------
evaluation:
  only_confidence: high          # 只有该置信度的题进入待测模型解题和评分
  pass_score: 2                  # 达标线：>= 2 分算可用
  valid_scores: [0, 1, 2, 3]
  invalid_retries: 2             # 裁判返回非法分数时的重试次数

  # 3 分要求的结构化输出格式。待测模型输出必须按顺序原样包含这两个标题
  # 才有资格评 3 分。改了这里必须同步改 prompts/stage7_score_target.md。
  required_output_headings:
    - "==**解题过程**=="
    - "==**最终答案**=="


# ------------------------------------------------------------
# paths：目录与文件名
# ------------------------------------------------------------
paths:
  excel_file: evaluation.xlsx
  runs_dir: runs
  raw_image_dir: image
  ocr_output_dir: image_ocr
  clean_output_dir: image_ocr_clean
  log_dir: logs


# ------------------------------------------------------------
# excel：列映射（1-based）。除非要改表结构，一般不用动。
# 完整 54 列定义见 harness/references/excel-schema.md。
# ------------------------------------------------------------
excel:
  columns:
    question_id: 1          # A
    image_path: 2           # B
    grade_band: 3           # C
    subject: 4              # D
    question_type: 5        # E
    confidence: 26          # Z
    selected_ref_id: 27     # AA
    consensus_answer: 28    # AB
    pseudo_label: 29        # AC
    filter_reason: 30       # AD
    image_url: 31           # AE
    model_output: 32        # AF
    model_time: 33          # AG
    model_status: 34        # AH
    target_score: 35        # AI
    target_reason: 36       # AJ
  # 五参考模型横向评分输出列，顺序与 models.reference_models 一致
  reference_score_columns:
    - { label: ernie,  score: 37, reason: 38 }   # AK AL
    - { label: doubao, score: 39, reason: 40 }   # AM AN
    - { label: qwen,   score: 41, reason: 42 }   # AO AP
    - { label: claude, score: 43, reason: 44 }   # AQ AR
    - { label: gemini, score: 45, reason: 46 }   # AS AT


# ------------------------------------------------------------
# logging
# ------------------------------------------------------------
logging:
  max_message_length: 2000       # 单条日志截断长度
  max_api_log_length: 800        # API prompt/response 记录截断长度
